[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-ai-backend"
version = "0.1.0"
description = "Enterprise AI Digital Assistant Core Backend Services"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "langgraph>=0.0.30",
    "langchain-core>=0.1.30",
    "langchain-community>=0.0.28",
    "qdrant-client>=1.8.0",
    "sqlalchemy>=2.0.28",
    "alembic>=1.13.1",
    "redis>=5.0.3"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.3.0",
    "mypy>=1.9.0",
    "ragas>=0.1.0",
    "datasets>=2.18.0"
]

