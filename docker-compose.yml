version: '3.8'

services:
  # 1. Python FastAPI Backend Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ea-backend
    ports:
      - "8000:8000"
    environment:
      - MYSQL_SERVER=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=root
      - MYSQL_PASSWORD=rootpassword
      - MYSQL_DB=enterprise_ai
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: always

  # 2. MySQL 8.0 Relational Database
  mysql:
    image: mysql:8.0
    container_name: ea-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: enterprise_ai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  # 3. Redis 7.0 High-Speed Cache & Broker
  redis:
    image: redis:7.0-alpine
    container_name: ea-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: always

  # 4. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: ea-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

volumes:
  mysql_data:
  redis_data:
  qdrant_data:
