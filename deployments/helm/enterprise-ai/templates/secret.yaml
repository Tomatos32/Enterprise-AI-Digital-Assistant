{{- if .Values.secrets.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name | default (printf "%s-secret" (include "enterprise-ai.fullname" .)) }}
  labels:
    {{- include "enterprise-ai.labels" . | nindent 4 }}
type: Opaque
stringData:
  MYSQL_USER: {{ .Values.secrets.mysqlUser | quote }}
  MYSQL_PASSWORD: {{ .Values.secrets.mysqlPassword | quote }}
  REDIS_PASSWORD: {{ .Values.secrets.redisPassword | quote }}
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  HR_API_TOKEN: {{ .Values.secrets.hrApiToken | quote }}
  ERP_API_TOKEN: {{ .Values.secrets.erpApiToken | quote }}
  OA_API_TOKEN: {{ .Values.secrets.oaApiToken | quote }}
  WECOM_WEBHOOK_URL: {{ .Values.secrets.wecomWebhookUrl | quote }}
  DIFY_API_KEY: {{ .Values.secrets.difyApiKey | quote }}
{{- end }}
