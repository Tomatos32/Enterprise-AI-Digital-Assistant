{{- if and .Values.ingress.enabled .Values.canary.enabled -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "enterprise-ai.fullname" . }}-canary
  labels:
    {{- include "enterprise-ai.labels" . | nindent 4 }}
    track: canary
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-weight: {{ .Values.canary.weight | quote }}
    {{- if .Values.canary.header.enabled }}
    nginx.ingress.kubernetes.io/canary-by-header: {{ .Values.canary.header.name | quote }}
    nginx.ingress.kubernetes.io/canary-by-header-value: {{ .Values.canary.header.value | quote }}
    {{- end }}
    {{- if .Values.canary.cookie.enabled }}
    nginx.ingress.kubernetes.io/canary-by-cookie: {{ .Values.canary.cookie.name | quote }}
    {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    {{- toYaml .Values.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "enterprise-ai.fullname" $ }}-canary
                port:
                  number: {{ $.Values.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
