apiVersion: v1
kind: Service
metadata:
  name: {{ include "enterprise-ai.fullname" . }}
  labels:
    {{- include "enterprise-ai.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "enterprise-ai.selectorLabels" . | nindent 4 }}
{{- if .Values.canary.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "enterprise-ai.fullname" . }}-canary
  labels:
    {{- include "enterprise-ai.labels" . | nindent 4 }}
    track: canary
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
      name: http
  selector:
    {{- include "enterprise-ai.canarySelectorLabels" . | nindent 4 }}
{{- end }}
